<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#D4AF37" />
    <meta name="description" content="Jaey Ride - Campus Ride Sharing App" />
    <!-- PWA Integration -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="preconnect" href="https://mt0.google.com" crossorigin="" />
    <link rel="preconnect" href="https://mt1.google.com" crossorigin="" />
    <link rel="preconnect" href="https://mt2.google.com" crossorigin="" />
    <link rel="preconnect" href="https://mt3.google.com" crossorigin="" />
    <link rel="dns-prefetch" href="https://mt0.google.com" />
    <link rel="dns-prefetch" href="https://mt1.google.com" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="%PUBLIC_URL%/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- Preload hero car image at high priority -->
    <link rel="preload" as="image" href="%PUBLIC_URL%/car_top.png" fetchpriority="high" />
    <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
    <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->
    <title>Jaey Ride</title>

    <script>
        // SPA redirect handler for direct page refreshes
        (function(){
          var redirect = sessionStorage.redirect;
          delete sessionStorage.redirect;
          if (redirect && redirect != location.href) {
            history.replaceState(null, null, redirect);
          }
        })();
    </script>
    <script>
      window.addEventListener('error', function(e) {
        console.error('GLOBAL_ERROR:', e.message, e.filename, e.lineno, e.colno, e.error);
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('UNHANDLED_REJECTION:', e.reason);
      });
    </script>
</head>

<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
</body>

</html>
