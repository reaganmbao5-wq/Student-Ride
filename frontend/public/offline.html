<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuluRides - Offline</title>
    <meta name="theme-color" content="#0B0B0B">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #0B0B0B;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .icon {
            width: 80px;
            height: 80px;
            background-color: rgba(212, 175, 55, 0.1);
            /* Gold tint */
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            animation: pulse 2s infinite ease-in-out;
        }

        .icon svg {
            width: 40px;
            height: 40px;
            color: #D4AF37;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        p {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.6);
            max-width: 400px;
            line-height: 1.5;
            margin-bottom: 32px;
        }

        button {
            background-color: #D4AF37;
            color: #000;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #e6c147;
        }

        button:active {
            transform: scale(0.98);
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4);
            }

            70% {
                box-shadow: 0 0 0 20px rgba(212, 175, 55, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(212, 175, 55, 0);
            }
        }
    </style>
</head>

<body>
    <div class="icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m2 2 20 20" />
            <path d="M8.5 8.5c-.77.77-1.39 1.63-1.87 2.58" />
            <path d="M12.58 12.58c.28-.31.6-.6.92-.88" />
            <path d="M22 12c-1.3-.92-2.8-1.7-4.4-2.28" />
            <path d="M16 16c-.53.53-1.12 1-1.77 1.4" />
            <path d="M6.3 6.3c-1.38 1.5-2.5 3.23-3.3 5.17" />
            <path d="M12 21a9.98 9.98 0 0 0 6.64-2.53" />
            <path d="M2 12A10 10 0 0 1 12 2" />
        </svg>
    </div>
    <h1>You're Offline</h1>
    <p>It seems you've lost your connection to the network. Please check your internet settings and try again.</p>
    <button onclick="window.location.reload()">Try Again</button>
</body>

</html>
